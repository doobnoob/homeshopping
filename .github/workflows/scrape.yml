name: Check prices
on:
  schedule:
    - cron: "0 21 * * *"    # daily full check, about 7:30am Adelaide
    - cron: "15 * * * *"    # hourly: only links that have never been checked (new items)
  workflow_dispatch:         # run everything manually from the Actions tab
jobs:
  scrape:
    runs-on: ubuntu-latest
    env:
      QUICK: ${{ github.event.schedule == '15 * * * *' }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.12" }
      - run: pip install -r scraper/requirements.txt
      - if: env.QUICK != 'true'
        run: playwright install --with-deps chromium
      - run: python scraper/scrape.py
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_KEY: ${{ secrets.SUPABASE_SERVICE_KEY }}
